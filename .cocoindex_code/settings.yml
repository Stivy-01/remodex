# CocoIndex Code (ccc) - Remodex
#
# Scope: semantic index for iOS, Android, shared Swift core, and the local bridge.
# Keep generated/build folders excluded so parity searches stay focused.
#
# After changing this file: `ccc index` (or `ccc reset && ccc index` after embedding model changes).
#
# Examples:
#   ccc search --path 'CodexMobile/**' "message persistence encrypt"
#   ccc search --path 'android/**' "CodexMessagePersistence AES"
#   ccc search --path 'phodex-bridge/**' "thread read include turns"
#   ccc search "relay pairing handshake WebSocket"

include_patterns:
  # iOS app and shared Swift core.
  - 'CodexMobile/**/*.swift'
  - 'shared/**/*.swift'
  # Android app (Kotlin, Gradle Kotlin DSL, manifest, and relevant strings).
  - 'android/**/*.kt'
  - 'android/**/*.kts'
  - 'android/**/src/main/AndroidManifest.xml'
  - 'android/**/src/main/res/values/*.xml'
  # Local bridge contracts and tests.
  - 'phodex-bridge/src/**/*.js'
  - 'phodex-bridge/test/**/*.js'
  - 'phodex-bridge/bin/**/*.js'

exclude_patterns:
  - '**/.*'
  - '**/.cocoindex_code'
  - '**/node_modules/**'
  - '**/coverage/**'
  - '**/dist/**'
  - '**/.gradle/**'
  - '**/build/**'
  - '**/build'
  - '**/DerivedData/**'
  - '**/*.xcuserdatad/**'
  - '**/xcuserdata/**'

language_overrides:
  - ext: swift
    lang: swift
  - ext: kt
    lang: kotlin
  - ext: kts
    lang: kotlin
  - ext: js
    lang: javascript
